timeline:
  - title: "YES Kushtia Founded"
    year: 2022
    description: "Ataur Rahman starts YES Kushtia to empower rural students in Bangladesh."

  - title: "First Online Workshop"
    year: 2022
    description: "The first virtual session gathers 50+ students from Kushtia and surrounding areas."

  - title: "Scholarship Program Launch"
    year: 2023
    description: "YES Kushtia begins awarding need-based scholarships for university applicants."

  - title: "Reached 1,000+ Youth"
    year: 2024
    description: "Through courses, mentorship, and scholarships, the initiative makes a real impact."
