#
# Work based on https://github.com/mmistakes/minimal-mistakes/blob/master/_data/ui-text.yml
#
# Configuration: Add to _config.yml
# locale: "en-US"  [YOUR PREFERRED LOCALE]
#
# How to use:
# {{ site.data.ui-text[site.locale].<var_name> | default: 'text' }}

# English (default)
# -----------------
en: &DEFAULT_EN
  header:
    title: Welcome to our Studio!
    text: It's Nice To Meet You
    button: Tell Me More
    buttonlink: "#services"

  services:
    title: "Services"
    text: ""
    section: services
    list:
      - title: "Personal Development"
        desc: "Workshops and sessions to build confidence, communication, and life skills."
        icon: fas fa-user
      - title: "Professional Growth"
        desc: "Practical career guidance, resume reviews, and interview preparation."
        icon: fas fa-briefcase
      - title: "Online Courses"
        desc: "Accessible learning on goal setting, discipline, productivity, and more."
        icon: fas fa-laptop
      - title: "Mentorship"
        desc: "1-on-1 and group mentorship for students navigating education and life."
        icon: fas fa-hands-helping
      - title: "Scholarships"
        desc: "Financial support and guidance for promising students pursuing university education."
        icon: fas fa-graduation-cap

  timeline:
    title: "Our Journey"
    text: "YES Kushtia's Impact Over the Years"
    section: timeline
    events:
      - title: "YES Kushtia Founded"
        year: "2022"
        desc: "Ataur Rahman starts YES Kushtia to empower rural students in Bangladesh."
        image: assets/img/timeline/1.jpg
        alt: "YES Kushtia Foundation"
      - title: "First Online Workshop"
        year: "2022"
        desc: "The first virtual session gathers 50+ students from Kushtia and surrounding areas."
        image: assets/img/timeline/2.jpg
        alt: "Online Workshop"
      - title: "Scholarship Program Launch"
        year: "2023"
        desc: "YES Kushtia begins awarding need-based scholarships for university applicants."
        image: assets/img/timeline/3.jpg
        alt: "Scholarship Program"
      - title: "Reached 1,000+ Youth"
        year: "2024"
        desc: "Through courses, mentorship, and scholarships, the initiative makes a real impact."
        image: assets/img/timeline/4.jpg
        alt: "Youth Impact"
    end: "Be Part <br> of Our <br> Journey!"

  about:
    title: "About Us"
    text: "Empowering Rural Youth"
    body: "YES Kushtia is dedicated to bridging the educational and opportunity gap for rural youth in Bangladesh. Founded in 2022, our initiative combines mentorship, skill development, and financial support to help talented young individuals reach their full potential. Through our comprehensive programs, we're building a community of empowered youth who will drive positive change in their communities and beyond."
    section: about

  team:
    title: "Our Team"
    text: "The People Behind YES Kushtia"
    section: team
    people:
      - name: "Ataur Rahman"
        role: "Founder & Life Coach"
        image: assets/img/team/ataur.jpg
        social:
          - url: https://linkedin.com/in/ataurrahman
            icon: fab fa-linkedin
          - url: https://facebook.com/yeskushtia
            icon: fab fa-facebook

  contact:
    title: "Contact Us"
    text: "Lorem ipsum or call 123456789"
    section: contact
    name: "Name*"
    name-validation: "Please enter your name."
    email: "Email*"
    email-validation: "Please enter your email address."
    phone: "Phone Number"
    phone-validation: "Please enter your phone number."
    message: "Message*"
    message-validation: "Please enter a message."
    subject: "Contact Form Submission"
    submit: "Send Message"

  footer:
    legal: "Privacy Policy"
    social:
      - url: https://twitter.com
        icon: "fab fa-twitter"
      - url: https://facebook.com
        icon: "fab fa-facebook-f"
      - url: https://linkedin.com
        icon: "fab fa-linkedin-in"
      - url: https://github.com/raviriley/agency-jekyll-theme
        icon: "fab fa-github"
      - url: https://instagram.com
        icon: "fab fa-instagram"
en-US:
  <<: *DEFAULT_EN
en-CA:
  <<: *DEFAULT_EN
en-GB:
