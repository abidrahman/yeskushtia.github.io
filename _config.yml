# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

theme: null

url    : "https://yeskushtia.com" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog

# Updated site settings for personalization
title      : "YES Kushtia - Empowering Rural Youth"
email      : "ataur137@hotmail.com" # Contact email for Ataur Rahman
description: "Empowering young adults in rural Bangladesh to achieve personal and professional growth."
author     : "Ataur Rahman"
slogan     : "...better together everyday" # Added slogan for the initiative

# Additional custom variables for the initiative
focus_area : "Young adults in rural Bangladesh, especially Kushtia"
services   : "Courses, online sessions, and scholarships for personal and professional development"

locale: "en-US" # See available languages in _data/sitetext.yml

analytics:
  google: "" # Add Google Analytics tracking code if available

collections:
  portfolio:

markdown: kramdown

# Sass/SCSS
sass:
  style: compressed
  sass_dir: _sass
  load_paths:
    - _sass
    - assets/css

# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
# formspree_form_path: "f/a_form_id"